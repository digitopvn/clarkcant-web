name: Deploy blog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-blog
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLARKCANT_SOURCE: ${{ github.workspace }}/.clarkcant-source
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BLOG_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: digitopvn/clarkcant
          ref: b7f9e364a24299317aba94f2b32af76550caa024
          path: .clarkcant-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .clarkcant-source
      - run: corepack pnpm build:widgets
      - run: corepack pnpm verify
      # The operator must back up D1 and apply pending migrations before dispatch.
      - run: corepack pnpm exec wrangler deploy --config wrangler.production.jsonc
