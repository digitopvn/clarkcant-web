name: Blog checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLARKCANT_SOURCE: ${{ github.workspace }}/.clarkcant-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: digitopvn/clarkcant
          ref: b7f9e364a24299317aba94f2b32af76550caa024
          path: .clarkcant-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .clarkcant-source
      - run: corepack pnpm build:widgets
      - run: corepack pnpm verify
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: |
          cat > /tmp/handles.cjs <<'JS'
          setTimeout(()=>{console.error('HANDLES',JSON.stringify(process._getActiveHandles().map(x=>x.constructor?.name)))},15000).unref();
          JS
          NODE_OPTIONS="--require=./scripts/cf-local-exit-preload.cjs --require=/tmp/handles.cjs" timeout 40 node_modules/.bin/cf d1 migrations list 00000000-0000-4000-8000-000000000000 --local --persist-to /tmp/s1 < /dev/null && echo "exit-preload=0" || echo "exit-preload=$?"
      - run: timeout 120 corepack pnpm db:local
      - run: timeout 120 corepack pnpm db:seed:browser
      - run: corepack pnpm test:e2e
