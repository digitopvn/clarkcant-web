name: Blog checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLARKCANT_SOURCE: ${{ github.workspace }}/.clarkcant-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: digitopvn/clarkcant
          ref: b7f9e364a24299317aba94f2b32af76550caa024
          path: .clarkcant-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .clarkcant-source
      - run: corepack pnpm build:widgets
      - run: corepack pnpm verify
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: |
          timeout 60 node_modules/.bin/cf d1 migrations apply 00000000-0000-4000-8000-000000000000 --local --persist-to .wrangler/state < /dev/null & P=$!
          sleep 25; echo "--- after 25s"; ps -ef --forest | grep -v grep | grep -A8 -i "cf d1\|workerd" | head -40
          ls -la ~/.config/cloudflare 2>/dev/null; cat ~/.config/cloudflare/*.json 2>/dev/null | head -20
          wait $P; echo "exit=$?"
          rm -rf .wrangler/state
          CF_SEND_TELEMETRY=false timeout 60 node_modules/.bin/cf d1 migrations apply 00000000-0000-4000-8000-000000000000 --local --persist-to .wrangler/state < /dev/null; echo "exit-notelemetry=$?"
      - run: corepack pnpm db:seed:browser
      - run: corepack pnpm test:e2e
