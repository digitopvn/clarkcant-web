<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · ClarkCant</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <script>
    try { const t = localStorage.getItem("cc-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/orb.css">
  <style>
    .lost { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-5); padding: 2rem var(--gutter); text-align: center; }
    .lost .orb { width: clamp(140px, 22vw, 220px); }
    .lost h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--step-4); line-height: 1; letter-spacing: -0.03em; }
    .lost p { color: var(--text-muted); max-width: 30rem; }
  </style>
</head>
<body>
  <main class="lost">
    <div class="orb"><canvas data-orb aria-hidden="true"></canvas></div>
    <h1>Clark couldn't find that page.</h1>
    <p>This one is honestly missing. Everything else is back on the home page.</p>
    <a class="button" href="/">Back to ClarkCant</a>
  </main>
  <script type="module">
    import { mountOrb } from "/assets/js/orb/mount-orb.js";
    const orb = mountOrb(document.querySelector("canvas[data-orb]"), { maxPixelRatio: 1.25 });
    // A dimmer, quieter Orb: nothing went wrong, it just isn't here.
    orb.setShape({ exposure: 1.1, glow: 0.14, chromatic: 0.2 });
  </script>
</body>
</html>
